[project]
name = "p02-production-rag-platform"
version = "0.1.0"
description = "Multi-tenant document Q&A: hybrid retrieval, reranking, citations, memory, RLS isolation"
requires-python = ">=3.12"
# Runtime dependencies are added at the task that first needs them.
dependencies = [
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "langfuse>=4.16.0",
    "litellm>=1.103.1",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rq>=2.12.0",
    "selectolax>=0.4.13",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]  # the standard FastAPI pattern

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # demo scripts print long lines on purpose
"evals/*" = ["E501"]  # prompts are long strings of data
"tests/*" = ["E501"]  # SQL and prompt strings in tests

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
